
---
plugin: amazon.aws.aws_ec2
aws_profile: spoke-a
regions:
  - us-east-1
filters:
  instance-state-name: running
  tag:Monitoring: enabled
keyed_groups:
  - key: tags.Name
    prefix: name
  - key: instance_type
    prefix: type
hostnames:
  - instance-id
compose:
  ansible_host: instance_id
  ansible_connection: aws_ssm

